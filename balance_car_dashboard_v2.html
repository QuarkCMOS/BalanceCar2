<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Balance Car</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0f;--bg2:#111118;--bg3:#18181f;
  --border:#22222e;--border2:#2a2a38;
  --text:#d0d0e0;--dim:#555566;--dim2:#383848;
  --blue:#4a9eff;--green:#00d084;--orange:#ff9500;
  --red:#ff3b3b;--cyan:#00ccff;--purple:#a78bfa;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'SF Pro Display','Segoe UI',system-ui,sans-serif;font-size:13px;overflow-x:hidden}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar h1{font-size:11px;font-weight:600;letter-spacing:2.5px;color:var(--dim);text-transform:uppercase;flex:1;min-width:100px}
.conn-row{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);transition:background .4s,box-shadow .4s}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.err{background:var(--red);box-shadow:0 0 6px var(--red)}
#conn-text{font-size:11px;color:var(--dim)}
#hz-badge{font-size:10px;color:var(--dim2);background:var(--bg3);padding:2px 7px;border-radius:10px;border:1px solid var(--border)}
.btn{padding:4px 12px;border:1px solid var(--border2);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;background:var(--bg3);color:var(--text);transition:all .15s}
.btn:hover{background:var(--border2)}
.btn-blue{border-color:var(--blue);color:var(--blue)}
.btn-blue:hover{background:#4a9eff18}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:190px 1fr 150px;grid-template-rows:auto auto auto;gap:8px;padding:8px;max-width:1100px;margin:0 auto}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px}
.card-title{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* ── GAUGE ── */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.gauge-svg{width:130px;height:130px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:100%}
.metric{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 3px;text-align:center}
.metric .val{font-size:17px;font-weight:700;line-height:1;transition:color .1s}
.metric .unit{font-size:7.5px;color:var(--dim2);margin-top:1px}
.metric .lbl{font-size:7.5px;color:var(--dim);margin-top:2px}

/* ── STATE BADGE ── */
.badge{display:inline-block;padding:1px 8px;border-radius:12px;font-size:9.5px;font-weight:700;letter-spacing:.5px}
.s-IDLE{background:#1c1c28;color:var(--dim)}.s-RUN{background:#001e12;color:var(--green)}
.s-FALL{background:#1e0808;color:var(--red)}.s-ERR{background:#1e1200;color:var(--orange)}

/* ── MAIN CHART ── */
.chart-card{grid-column:2}
#mainChart{display:block;width:100%!important;border-radius:6px;background:var(--bg)}

/* ── CONTROLS ── */
.ctrl-card{display:flex;flex-direction:column;align-items:center;gap:10px}
.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:3px}
.dp{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--dim);cursor:pointer;user-select:none;-webkit-user-select:none;transition:all .1s;touch-action:manipulation}
.dp:not(.empty):hover{background:var(--border2);color:var(--text)}
.dp.pressed{background:#4a9eff18;border-color:var(--blue);color:var(--blue)}
.dp.empty{background:transparent;border:none;cursor:default}
.power-btn{width:52px;height:52px;border-radius:50%;border:2px solid var(--border2);background:var(--bg3);color:var(--dim);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.power-btn.on{border-color:var(--green);color:var(--green);background:#001e12;box-shadow:0 0 14px #00d08422}
.ctrl-lbl{font-size:8px;color:var(--dim2);letter-spacing:1px;text-transform:uppercase}

/* ── MOTOR ── */
.motor-card{grid-column:1/-1}
.motor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mgroup{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px}
.mgroup .gl{font-size:7.5px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.mgroup .gv{font-size:22px;font-weight:700;text-align:center;line-height:1}
.mgroup .gu{font-size:8px;color:var(--dim2);text-align:center;margin-top:1px}
.spark-wrap{margin-top:6px}
canvas.spark{display:block;width:100%!important;height:30px}

/* ── PID ── */
.pid-card{grid-column:2/-1}
.pid-inner{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pid-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.pid-row label{width:14px;font-size:12px;font-weight:700;color:#888}
.pid-row input{flex:1;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:4px 7px;border-radius:5px;font-size:12px;outline:none;transition:border-color .15s}
.pid-row input:focus{border-color:var(--blue)}
.pid-cur{font-size:8.5px;color:var(--dim);width:46px;text-align:right;font-variant-numeric:tabular-nums}
.btn-send{width:100%;padding:7px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;margin-top:4px;transition:opacity .15s}
.btn-send:hover{opacity:.85}
#log{font-size:9.5px;color:var(--dim);font-family:'SF Mono',monospace;height:80px;overflow-y:auto;background:var(--bg);border-radius:5px;padding:5px 7px;border:1px solid var(--border);white-space:pre-wrap;line-height:1.5}

@media(max-width:680px){
  .grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .chart-card{grid-column:1/-1}
  .motor-card{grid-column:1/-1}
  .pid-card{grid-column:1/-1}
  .motor-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:420px){
  .grid{grid-template-columns:1fr}
  .ctrl-card{grid-column:1/-1}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>⚖ Balance Car</h1>
  <div class="conn-row">
    <div class="dot" id="dot"></div>
    <span id="conn-text">Chưa kết nối</span>
    <span id="hz-badge">-- Hz</span>
    <button class="btn btn-blue" id="btn-conn" onclick="toggleConnect()">Connect</button>
  </div>
</div>

<div class="grid">

  <!-- Gauge -->
  <div class="card">
    <div class="card-title">
      Góc nghiêng &nbsp;
      <span class="badge s-IDLE" id="state-badge">IDLE</span>
    </div>
    <div class="gauge-wrap">
      <svg class="gauge-svg" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="54" fill="none" stroke="#1a1a24" stroke-width="1"/>
        <!-- ticks -->
        <g id="ticks"></g>
        <!-- zero marker -->
        <line x1="65" y1="11" x2="65" y2="20" stroke="#444" stroke-width="2" stroke-linecap="round"/>
        <!-- needle -->
        <line id="needle" x1="65" y1="65" x2="65" y2="18"
              stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="65" cy="65" r="4.5" fill="var(--blue)"/>
        <circle cx="65" cy="65" r="2" fill="var(--bg)"/>
      </svg>
      <div class="metrics">
        <div class="metric">
          <div class="val" id="m-angle" style="color:var(--blue)">0.00</div>
          <div class="unit">°</div><div class="lbl">Angle</div>
        </div>
        <div class="metric">
          <div class="val" id="m-target" style="color:var(--dim)">0.00</div>
          <div class="unit">°</div><div class="lbl">Target</div>
        </div>
        <div class="metric">
          <div class="val" id="m-pid" style="color:var(--orange)">0</div>
          <div class="unit"></div><div class="lbl">PID</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Chart -->
  <div class="card chart-card">
    <div class="card-title">
      Realtime &nbsp;
      <span style="color:var(--blue);font-size:9px">■</span> Angle &nbsp;
      <span style="color:var(--orange);font-size:9px">■</span> PID Out &nbsp;
      <span style="color:var(--green);font-size:9px">■</span> Target
      <span id="chart-hz" style="color:var(--dim2);font-size:8.5px;margin-left:auto"></span>
    </div>
    <canvas id="mainChart" height="152"></canvas>
  </div>

  <!-- Controls -->
  <div class="card ctrl-card">
    <div class="card-title">Controls</div>
    <div class="dpad">
      <div class="dp empty"></div>
      <div class="dp" id="dp-fwd"
           onmousedown="dDown('fwd')" onmouseup="dUp('fwd')" onmouseleave="dUp('fwd')"
           ontouchstart="dDown('fwd')" ontouchend="dUp('fwd')" ontouchcancel="dUp('fwd')">▲</div>
      <div class="dp empty"></div>
      <div class="dp" id="dp-lft"
           onmousedown="dDown('lft')" onmouseup="dUp('lft')" onmouseleave="dUp('lft')"
           ontouchstart="dDown('lft')" ontouchend="dUp('lft')" ontouchcancel="dUp('lft')">◀</div>
      <div class="dp empty"></div>
      <div class="dp" id="dp-rgt"
           onmousedown="dDown('rgt')" onmouseup="dUp('rgt')" onmouseleave="dUp('rgt')"
           ontouchstart="dDown('rgt')" ontouchend="dUp('rgt')" ontouchcancel="dUp('rgt')">▶</div>
      <div class="dp empty"></div>
      <div class="dp" id="dp-bwd"
           onmousedown="dDown('bwd')" onmouseup="dUp('bwd')" onmouseleave="dUp('bwd')"
           ontouchstart="dDown('bwd')" ontouchend="dUp('bwd')" ontouchcancel="dUp('bwd')">▼</div>
      <div class="dp empty"></div>
    </div>
    <button class="power-btn" id="powerBtn" onclick="togglePower()">⏻</button>
    <span class="ctrl-lbl" id="power-lbl">Standby</span>
  </div>

  <!-- Motor & Encoder -->
  <div class="card motor-card">
    <div class="card-title">Motor &amp; Encoder</div>
    <div class="motor-grid">
      <div class="mgroup"><div class="gl">PWM Left</div>
        <div class="gv" id="m-pwl" style="color:var(--text)">0</div><div class="gu"></div>
        <div class="spark-wrap"><canvas class="spark" id="sp-pwl"></canvas></div></div>
      <div class="mgroup"><div class="gl">PWM Right</div>
        <div class="gv" id="m-pwr" style="color:var(--text)">0</div><div class="gu"></div>
        <div class="spark-wrap"><canvas class="spark" id="sp-pwr"></canvas></div></div>
      <div class="mgroup"><div class="gl">RPM Left</div>
        <div class="gv" id="m-rl" style="color:var(--cyan)">0.0</div><div class="gu">rpm</div>
        <div class="spark-wrap"><canvas class="spark" id="sp-rl"></canvas></div></div>
      <div class="mgroup"><div class="gl">RPM Right</div>
        <div class="gv" id="m-rr" style="color:var(--cyan)">0.0</div><div class="gu">rpm</div>
        <div class="spark-wrap"><canvas class="spark" id="sp-rr"></canvas></div></div>
    </div>
  </div>

  <!-- PID Tuning -->
  <div class="card pid-card">
    <div class="card-title">PID Tuning</div>
    <div class="pid-inner">
      <div class="pid-form">
        <div class="pid-row">
          <label>P</label>
          <input type="number" id="in-p" step="0.5" value="30.0">
          <span class="pid-cur" id="cur-p">—</span>
        </div>
        <div class="pid-row">
          <label>I</label>
          <input type="number" id="in-i" step="0.01" value="0.0">
          <span class="pid-cur" id="cur-i">—</span>
        </div>
        <div class="pid-row">
          <label>D</label>
          <input type="number" id="in-d" step="0.05" value="0.5">
          <span class="pid-cur" id="cur-d">—</span>
        </div>
        <button class="btn-send" onclick="sendPID()">Gửi PID</button>
      </div>
      <div id="log"></div>
    </div>
  </div>

</div><!-- /grid -->

<script>
// ── JSON key map (ESP32 gửi key ngắn) ──────────────────────────
// a=angle  t=target  pid=pidOutput
// pwl=pwmLeft  pwr=pwmRight  rl=rpmLeft  rr=rpmRight
// s=state("IDLE"|"RUN"|"FALL"|"ERR")  ms=millis

// ── Gauge ticks ────────────────────────────────────────────────
(function() {
  var g = document.getElementById('ticks');
  for (var i = -180; i <= 180; i += 15) {
    var a = (i - 90) * Math.PI / 180;
    var major = (i % 45 === 0);
    var r1 = major ? 45 : 49;
    var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', 65 + 54*Math.cos(a)); ln.setAttribute('y1', 65 + 54*Math.sin(a));
    ln.setAttribute('x2', 65 + r1*Math.cos(a)); ln.setAttribute('y2', 65 + r1*Math.sin(a));
    ln.setAttribute('stroke', major ? '#444' : '#222');
    ln.setAttribute('stroke-width', major ? 1.5 : 0.7);
    g.appendChild(ln);
    if (major) {
      var tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tx.setAttribute('x', 65 + 37*Math.cos(a)); tx.setAttribute('y', 65 + 37*Math.sin(a));
      tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('dominant-baseline', 'central');
      tx.setAttribute('fill', i === 0 ? '#666' : '#2a2a3a');
      tx.setAttribute('font-size', i === 0 ? '8.5' : '7');
      tx.textContent = i + '°';
      g.appendChild(tx);
    }
  }
})();

var needle = document.getElementById('needle');
function setNeedle(deg) {
  var r = (deg - 90) * Math.PI / 180, L = 47;
  needle.setAttribute('x2', 65 + L*Math.cos(r));
  needle.setAttribute('y2', 65 + L*Math.sin(r));
  var a = Math.abs(deg);
  needle.setAttribute('stroke', a < 8 ? 'var(--green)' : a < 25 ? 'var(--blue)' : a < 50 ? 'var(--orange)' : 'var(--red)');
}

// ── Circular buffers ──────────────────────────────────────────
var BUF = 300;
function CB(n) { this.b = new Float32Array(n).fill(NaN); this.n = n; this.h = 0; }
CB.prototype.push = function(v) { this.b[this.h] = v; this.h = (this.h + 1) % this.n; };
CB.prototype.get  = function(i) { return this.b[(this.h + i) % this.n]; };

var bAngle = new CB(BUF), bPid = new CB(BUF), bTarget = new CB(BUF);
var bPwl = new CB(BUF), bPwr = new CB(BUF), bRl = new CB(BUF), bRr = new CB(BUF);

// ── Main chart ────────────────────────────────────────────────
var MC = document.getElementById('mainChart');
var MX = MC.getContext('2d');
function resizeMC() { MC.width = MC.parentElement.clientWidth - 22; }
resizeMC();
window.addEventListener('resize', resizeMC);

function drawMain() {
  requestAnimationFrame(drawMain);
  var W = MC.width, H = MC.height;
  MX.clearRect(0,0,W,H);
  MX.fillStyle = '#0b0b0f'; MX.fillRect(0,0,W,H);
  // grid lines
  MX.strokeStyle = '#14141c'; MX.lineWidth = 1;
  for (var i = 1; i < 4; i++) {
    MX.beginPath(); MX.moveTo(0, i*H/4); MX.lineTo(W, i*H/4); MX.stroke();
  }
  MX.strokeStyle = '#1e1e28'; MX.beginPath(); MX.moveTo(0,H/2); MX.lineTo(W,H/2); MX.stroke();
  var dx = W / (BUF - 1);
  drawLine(MX, bTarget, W, H, dx, 'var(--green)',  1.2, 180, 0.5);
  drawLine(MX, bPid,    W, H, dx, 'var(--orange)', 1.2, 1023, 0.65);
  drawLine(MX, bAngle,  W, H, dx, 'var(--blue)',   2,   180,  1);
}
function drawLine(ctx, cb, W, H, dx, color, lw, scale, alpha) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.globalAlpha = alpha;
  ctx.beginPath(); var s = false;
  for (var i = 0; i < BUF; i++) {
    var v = cb.get(i); if (isNaN(v)) { s = false; continue; }
    var x = i*dx, y = H/2 - v*(H/2/scale);
    if (!s) { ctx.moveTo(x,y); s = true; } else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}
requestAnimationFrame(drawMain);

// ── Sparklines ────────────────────────────────────────────────
var sparkDefs = [
  { id:'sp-pwl', buf:bPwl, scale:1023, color:'var(--text)' },
  { id:'sp-pwr', buf:bPwr, scale:1023, color:'var(--text)' },
  { id:'sp-rl',  buf:bRl,  scale:300,  color:'var(--cyan)' },
  { id:'sp-rr',  buf:bRr,  scale:300,  color:'var(--cyan)' },
];
var sparks = sparkDefs.map(function(d) {
  var c = document.getElementById(d.id);
  c.width = c.parentElement.clientWidth; c.height = 30;
  return { ctx: c.getContext('2d'), cvs: c, meta: d };
});
window.addEventListener('resize', function() {
  sparks.forEach(function(s) {
    s.cvs.width = s.cvs.parentElement.clientWidth;
  });
});
function drawSpark(s) {
  var ctx = s.ctx, c = s.cvs, buf = s.meta.buf;
  var scale = s.meta.scale, color = s.meta.color;
  var W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#0b0b0f'; ctx.fillRect(0,0,W,H);
  var dx = W / (BUF-1);
  ctx.beginPath(); var started = false;
  for (var i = 0; i < BUF; i++) {
    var v = buf.get(i); if (isNaN(v)) { started = false; continue; }
    var x = i*dx, y = H - Math.max(0, Math.min(H, (Math.abs(v)/scale)*H));
    if (!started) { ctx.moveTo(x,H); ctx.lineTo(x,y); started = true; } else ctx.lineTo(x,y);
  }
  if (started) { ctx.lineTo((BUF-1)*dx, H); ctx.closePath(); }
  // Resolve CSS variable → không dùng được trực tiếp trong fillStyle, dùng hex fallback
  var solidColor = color.replace('var(--text)', '#d0d0e0')
                        .replace('var(--cyan)', '#00ccff');
  ctx.fillStyle = solidColor + '18'; ctx.fill();
  ctx.strokeStyle = solidColor; ctx.lineWidth = 1.2;
  ctx.beginPath(); started = false;
  for (var i = 0; i < BUF; i++) {
    var v = buf.get(i); if (isNaN(v)) { started = false; continue; }
    var x = i*dx, y = H - Math.max(0, Math.min(H, (Math.abs(v)/scale)*H));
    if (!started) { ctx.moveTo(x,y); started = true; } else ctx.lineTo(x,y);
  }
  ctx.stroke();
}
function drawSparks() { requestAnimationFrame(drawSparks); sparks.forEach(drawSpark); }
requestAnimationFrame(drawSparks);

// ── WebSocket ──────────────────────────────────────────────────
var WS_URL = 'ws://192.168.4.1:81/';
var ws = null, connected = false, reconnTimer = null, reconnCount = 0;
var _mc = 0, _ht = performance.now();

function toggleConnect() {
  if (connected || (ws && ws.readyState === WebSocket.CONNECTING)) {
    disconnect();
  } else {
    reconnCount = 0;
    connect();
  }
}

function connect() {
  clearRTimer();

  // Nếu đang có ws cũ → đóng hẳn trước
  if (ws) {
    ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
    ws.close();
    ws = null;
  }

  setConnecting();
  addLog('[WS] Đang kết nối → ' + WS_URL);

  try {
    ws = new WebSocket(WS_URL);
  } catch(e) {
    addLog('[WS] Không thể tạo WebSocket: ' + e.message);
    addLog('[WS] → Kiểm tra: đã kết nối WiFi "BalanceCar" chưa?');
    setConn(false, 'Lỗi tạo kết nối');
    schedReconn();
    return;
  }

  // Timeout 5s nếu không connect được
  var connTimeout = setTimeout(function() {
    if (ws && ws.readyState !== WebSocket.OPEN) {
      addLog('[WS] Timeout 5s — không kết nối được');
      addLog('[WS] Gợi ý:');
      addLog('  1. Kết nối WiFi "BalanceCar" / "12345678"');
      addLog('  2. Đảm bảo ESP32 đang chạy');
      addLog('  3. Thử mở: http://192.168.4.1 trên browser');
      ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
      ws.close(); ws = null;
      setConn(false, 'Timeout — thử lại sau 5s');
      schedReconn();
    }
  }, 5000);

  ws.onopen = function() {
    clearTimeout(connTimeout);
    reconnCount = 0;
    setConn(true, '192.168.4.1 ✓');
    _ht = performance.now(); _mc = 0;
    addLog('[WS] Kết nối thành công!');
  };

  ws.onclose = function(e) {
    clearTimeout(connTimeout);
    if (connected) {
      // Chỉ log nếu trước đó đang connected (tránh log khi timeout)
      addLog('[WS] Mất kết nối (code=' + e.code + ')');
    }
    setConn(false, 'Mất kết nối');
    schedReconn();
  };

  ws.onerror = function() {
    clearTimeout(connTimeout);
    // onerror luôn đi kèm onclose → không schedReconn ở đây
    addLog('[WS] Lỗi kết nối');
  };

  ws.onmessage = onMsg;
}

function disconnect() {
  clearRTimer();
  if (ws) {
    ws.onopen = ws.onclose = ws.onerror = ws.onmessage = null;
    ws.close();
    ws = null;
  }
  setConn(false, 'Đã ngắt');
  addLog('[WS] Ngắt kết nối thủ công');
}

function schedReconn() {
  clearRTimer();
  reconnCount++;
  var delay = Math.min(3000 * reconnCount, 15000); // backoff: 3s, 6s, 9s... max 15s
  addLog('[WS] Thử lại lần ' + reconnCount + ' sau ' + (delay/1000) + 's...');
  reconnTimer = setTimeout(function() { if (!connected) connect(); }, delay);
}
function clearRTimer() {
  if (reconnTimer) { clearTimeout(reconnTimer); reconnTimer = null; }
}

function setConnecting() {
  document.getElementById('dot').className = 'dot';
  document.getElementById('dot').style.background = 'var(--orange)';
  document.getElementById('conn-text').textContent = 'Đang kết nối...';
  document.getElementById('btn-conn').textContent = 'Hủy';
}

function setConn(ok, label) {
  connected = ok;
  var dot = document.getElementById('dot');
  dot.style.background = '';  // xóa inline style, dùng class
  dot.className = 'dot ' + (ok ? 'ok' : 'err');
  document.getElementById('conn-text').textContent = label;
  document.getElementById('btn-conn').textContent = ok ? 'Disconnect' : 'Connect';
}

function onMsg(evt) {
  var d;
  try { d = JSON.parse(evt.data); } catch(e) { return; }
  if (d.status) return; // ACK packet

  _mc++;
  var now = performance.now();
  if (now - _ht >= 1000) {
    var hz = (_mc / ((now - _ht) / 1000)).toFixed(1);
    document.getElementById('hz-badge').textContent = hz + ' Hz';
    document.getElementById('chart-hz').textContent = hz + ' Hz';
    _mc = 0; _ht = now;
  }

  // Unpack JSON keys ngắn
  var angle  = d.a   ?? 0;
  var target = d.t   ?? 0;
  var pid    = d.pid ?? 0;
  var pwl    = d.pwl ?? 0;
  var pwr    = d.pwr ?? 0;
  var rl     = d.rl  ?? 0;
  var rr     = d.rr  ?? 0;
  var state  = d.s   ?? 'IDLE';

  // Metrics
  $('m-angle',  angle.toFixed(2));
  $('m-target', target.toFixed(2));
  $('m-pid',    Math.round(pid));
  $('m-pwl',    pwl);
  $('m-pwr',    pwr);
  $('m-rl',     rl.toFixed(1));
  $('m-rr',     rr.toFixed(1));

  // Angle color
  var aa = Math.abs(angle);
  document.getElementById('m-angle').style.color =
    aa < 5 ? 'var(--green)' : aa < 20 ? 'var(--blue)' : aa < 50 ? 'var(--orange)' : 'var(--red)';

  setNeedle(angle);

  // State badge
  var b = document.getElementById('state-badge');
  b.textContent = state;
  b.className = 'badge s-' + state;

  // Buffers
  bAngle.push(angle); bPid.push(pid); bTarget.push(target);
  bPwl.push(pwl); bPwr.push(pwr); bRl.push(rl); bRr.push(rr);
}

function $(id, val) { document.getElementById(id).textContent = val; }

// ── PID ────────────────────────────────────────────────────────
function sendPID() {
  if (!ws || ws.readyState !== 1) { addLog('WS chưa kết nối'); return; }
  var kp = parseFloat(document.getElementById('in-p').value);
  var ki = parseFloat(document.getElementById('in-i').value);
  var kd = parseFloat(document.getElementById('in-d').value);
  ws.send(JSON.stringify({ type:'PID', p:kp, i:ki, d:kd }));
  document.getElementById('cur-p').textContent = kp.toFixed(2);
  document.getElementById('cur-i').textContent = ki.toFixed(3);
  document.getElementById('cur-d').textContent = kd.toFixed(3);
  var t = new Date();
  addLog('[' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds())
         + '] P=' + kp + ' I=' + ki + ' D=' + kd);
}
function pad(n) { return String(n).padStart(2,'0'); }
function addLog(msg) {
  var el = document.getElementById('log');
  el.textContent = msg + '\n' + el.textContent;
  if (el.textContent.length > 800) el.textContent = el.textContent.slice(0, 800);
}

// ── Power ──────────────────────────────────────────────────────
var powerOn = false;
function togglePower() {
  powerOn = !powerOn;
  document.getElementById('powerBtn').classList.toggle('on', powerOn);
  document.getElementById('power-lbl').textContent = powerOn ? 'Running' : 'Standby';
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type:'POWER', on:powerOn }));
  addLog('[PWR] ' + (powerOn ? 'ON' : 'OFF'));
}

// ── D-Pad ──────────────────────────────────────────────────────
function dDown(dir) {
  document.getElementById('dp-' + dir).classList.add('pressed');
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type:'CTRL', dir:dir, state:1 }));
}
function dUp(dir) {
  document.getElementById('dp-' + dir).classList.remove('pressed');
  if (ws && ws.readyState === 1)
    ws.send(JSON.stringify({ type:'CTRL', dir:dir, state:0 }));
}

// ── Keyboard shortcuts ─────────────────────────────────────────
var keyMap = { ArrowUp:'fwd', ArrowDown:'bwd', ArrowLeft:'lft', ArrowRight:'rgt' };
var keyDown = {};
document.addEventListener('keydown', function(e) {
  var dir = keyMap[e.key];
  if (dir && !keyDown[dir]) { keyDown[dir] = true; dDown(dir); }
});
document.addEventListener('keyup', function(e) {
  var dir = keyMap[e.key];
  if (dir) { keyDown[dir] = false; dUp(dir); }
});

// ── Auto-connect on load ───────────────────────────────────────
window.addEventListener('load', connect);
</script>
</body>
