; ================================================================
; PlatformIO Project Configuration
; ================================================================

; ── Production build ──────────────────────────────────────────
[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_flags =
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    littlemanbuilds/ESP32_MCPWM @ ^1.2.0
    links2004/WebSockets        @ ^2.4.0
    bblanchon/ArduinoJson       @ ^7.2.2

