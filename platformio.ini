; ================================================================
; PlatformIO Project Configuration
; ================================================================

; ── Production build ──────────────────────────────────────────
[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_flags =
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    littlemanbuilds/ESP32_MCPWM @ ^1.2.0
    links2004/WebSockets        @ ^2.4.0
    bblanchon/ArduinoJson       @ ^7.2.2

; ── Motor test ─────────────────────────────────────────────────
[env:esp32dev_motor_basic]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_src_filter =
    -<*>
    +<../test/test_motor_basic.cpp>
    +<drivers/motor_driver.cpp>
    +<drivers/pwm_manager.cpp>
build_flags =
    -std=gnu++17
    -D TEST_MODE
monitor_speed = 115200
lib_deps =
    littlemanbuilds/ESP32_MCPWM @ ^1.2.0

; ── Motor hardware test ────────────────────────────────────────
[env:esp32dev_test]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_src_filter =
    -<*>
    +<../test/test_motor_hardware.cpp>
build_flags =
    -std=gnu++17
    -D TEST_MODE
monitor_speed = 115200
lib_deps =
    littlemanbuilds/ESP32_MCPWM @ ^1.2.0

; ── GPIO/PWM test ──────────────────────────────────────────────
[env:esp32dev_gpio_test]
platform    = espressif32
board       = esp32dev
framework   = arduino
build_src_filter =
    -<*>
    +<../test/test_gpio_pwm.cpp>
build_flags =
    -std=gnu++17
monitor_speed = 115200
lib_deps =
    littlemanbuilds/ESP32_MCPWM @ ^1.2.0

; ── Native unit tests ──────────────────────────────────────────
[env:native]
platform    = native
build_flags =
    -std=c++17
    -lm
build_src_filter =
    -<*>
    +<../test/test_control.cpp>
    +<../test/test_complementary_filter.cpp>
